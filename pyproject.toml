[project]
name = "woo-connector"
version = "0.1.0"
description = "Read-only WooCommerce connector for Agent Studio agents: orders, products and inventory over MCP."
authors = [{ name = "Shashank Singh", email = "shashankwork0908@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.9",
    "cryptography>=42",
]

[project.scripts]
woo-connector = "woo_connector.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "playwright>=1.45",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs the local WooCommerce store from dev/setup.sh"]

[build-system]
requires = ["uv_build>=0.8,<0.12.0"]
build-backend = "uv_build"
